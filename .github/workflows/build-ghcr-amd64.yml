name: Build workbuddy2api-panel (GHCR, amd64)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库的 tag / 分支 / commit（例如 v1.2.3、main）"
        required: false
        default: "main"
      image_tag:
        description: "推送的镜像 tag（留空则默认使用上面的 source_ref）"
        required: false
        default: ""

env:
  # 源仓库（公开仓库，Buildx 可直接远程构建，无需先 checkout）
  SOURCE_REPO: linguo2625469/workbuddy2api-panel
  # GHCR 镜像名（如需自定义可在此修改）
  IMAGE_NAME: workbuddy2api-panel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # 手动触发时优先使用 image_tag 输入，否则回退到 source_ref
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=${{ inputs.source_ref }},enable=${{ inputs.image_tag == '' }}

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 远程构建并推送（amd64）
        uses: docker/build-push-action@v6
        with:
          # 直接从远程仓库构建指定引用，不在工作流中 checkout 代码
          context: https://github.com/${{ env.SOURCE_REPO }}.git#${{ inputs.source_ref }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 提交 provenance 以便 GHCR 记录来源，无需 SBOM/attestation
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
